<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | KedyScans </title>
  
    <link rel="icon" type="image/x-icon" href="./Assets/Images/logo.ico">
    
    <link rel="stylesheet" href="./Css/loginTemplate.css">
    <link rel="stylesheet" href="./Css/register.css">
    <link rel="stylesheet" href="./Css/toast.css">

    <meta name="author" content="KedyCodeur">
    <meta name="description" content="Read your favorite manga online for free. Explore a vast collection of high-quality manga chapters, latest releases, and popular series.">
    <meta name="keywords" content="manga, read manga, free manga, manga online, latest manga chapters, KedyCodeur">
    <meta name="robots" content="index, follow">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />
</head>
<body>
    <main class="login-container">

        

        <form  method="POST" class="input-container">

                <img src="./Assets/Images/logoWithOutBg.png" alt="Logo Of KedyScans" class="logo" draggable="false">
                
                <div class="explanation">
                    <h1 class="login-title">KedyScans</h1>
                    <p class="small-explanation">Glad to have you here, man!</p>
                </div>

                <div class="aligner">
                    <label for="email">
                        <span>Email address</span>
                        <span class="input-holder">
                            <input type="email" name="email" id="email" autocomplete="email" autocapitalize="off" placeholder="Enter your email" required>
                        </span>
                    </label>
                </div>
                
                <div class="aligner">
                    <label for="password">
                        <span>Password</span>
                        <span class="input-holder">
                            <input type="password" name="password" id="password" autocomplete="new-password" autocapitalize="off" placeholder="Enter your password" minlength="6" required >
                            
                        </span>
                    </label>
                </div>

                <div class="aligner">
                    <label for="passwordConfirm">
                        <span>Confirm password</span>
                        <span class="input-holder">
                            <input type="password" name="passwordConfirm" id="passwordConfirm" autocomplete="new-password" autocapitalize="off" placeholder="Confirm your password" minlength="6"  required>
                        </span>
                    </label>
                </div>

                <div class="aligner rememberMe">
                        <p class="redirection">Have an account?<a href="./login.html" class="redirectionLink">Login</a></p>
                </div>

                <div class="button-container">
                    <button class="submit-button">Sign In</button>
                </div>
                
        </form>

        <div class="image-container">
            <img src="./Assets/Images/unnamed.jpeg" alt="Logo of the KedyScans" class="wallpaper" draggable="false">
        </div>
    </main>
    <holy-toaster></holy-toaster>
    <script  src="./Components/Toaster.js"></script>
    <script type="module" src="./Js/register.js"></script>
</body>

</html>
